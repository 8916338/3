<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.container {
  max-width:820px; margin:0 auto; position:relative;
  width:100%; overflow-x:hidden;
  flex:1; display:flex; flex-direction:column;
}

/* ===== 顶部标题区 ===== */
.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }

h1 {
  font-size:1.35rem; font-weight:700; color:#0a1a2b;
  line-height:1.4;
}

.header-divider {
  height:1px; background:#e4ebf3;
  margin:12px 0;
}

.subtitle {
  font-size:.78rem; color:#7a8fa3; line-height:1.8;
}

/* ===== 卡片主体 ===== */
.main-card {
  background:#fff; border-radius:8px;
  padding:20px 22px 18px;
  border:1px solid #d4dbe5;
  width:100%; overflow-x:hidden; flex:1;
  display:flex; flex-direction:column;
}

/* ===== QQ 群 ===== */
.qq-block {
  font-size:.76rem; color:#5a6f88; line-height:2;
  margin-top:6px;
}

.qq-block .qq-row {
  margin-top:8px;
}

.qq-block a {
  color:#4a9eff; text-decoration:none; font-weight:600;
}
.qq-block a:hover { text-decoration:underline; }

.section-title {
  font-size:.85rem; font-weight:700; color:#0a1a2b;
  margin:24px 0 4px;
}

/* ===== 四个并排图标入口（无背景，仅图标） ===== */
.quick-links {
  margin-top:16px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:26px;
  flex-wrap:wrap;
}

.quick-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:0;
  border:none;
  background:transparent;
  text-decoration:none;
  cursor:pointer;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.quick-icon {
  width:54px;
  height:54px;
  display:block;
  filter:drop-shadow(0 3px 8px rgba(10,26,43,.16));
  transition:transform .16s ease, filter .16s ease;
}

.quick-item:hover .quick-icon {
  transform:translateY(-3px);
  filter:drop-shadow(0 8px 16px rgba(10,26,43,.26));
}
.quick-item:active .quick-icon {
  transform:scale(.93);
}

.quick-label {
  font-size:.7rem;
  color:#7a8fa3;
  line-height:1.2;
  white-space:nowrap;
}

/* ===== 弹层 ===== */
.zsm-modal {
  position:fixed; inset:0; z-index:999;
  display:flex; align-items:center; justify-content:center;
  padding:26px 22px;
  visibility:hidden; opacity:0;
  transition:opacity .2s ease, visibility .2s ease;
}
.zsm-modal.open { visibility:visible; opacity:1; }

.zsm-modal-mask {
  position:absolute; inset:0;
  background:rgba(10,26,43,.62);
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}

.zsm-modal-panel {
  position:relative;
  width:100%; max-width:330px;
  background:#fff;
  border-radius:14px;
  padding:18px 18px 14px;
  text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.32);
  transform:scale(.9);
  opacity:0;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .2s ease;
}
.zsm-modal.open .zsm-modal-panel { transform:scale(1); opacity:1; }

.zsm-modal-panel img {
  display:block;
  width:auto; max-width:100%;
  max-height:56vh;
  margin:0 auto;
  border-radius:8px;
  border:1px solid #e4ebf3;
  background:#fff;
}

.zsm-modal-title {
  font-size:.82rem; font-weight:700; color:#0a1a2b;
  margin-bottom:12px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.zsm-modal-title svg { width:18px; height:18px; display:block; }

.zsm-modal-tip {
  font-size:.72rem; color:#7a8fa3; line-height:1.7;
  margin-top:12px;
}

.zsm-modal-close {
  position:absolute; top:-11px; right:-11px;
  width:32px; height:32px;
  border:none; border-radius:50%;
  background:#4a9eff; color:#fff;
  font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(74,158,255,.45);
  transition:background .15s, transform .08s;
  touch-action:manipulation;
}
.zsm-modal-close:hover { background:#2a7ed9; }
.zsm-modal-close:active { transform:scale(.9); }

/* ===== 返回首页按钮 ===== */
.home-btn-wrap {
  text-align:center; margin-top:28px;
}

.home-btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px;
  height:42px; padding:0 28px;
  background:#4a9eff; color:#fff;
  border:none; border-radius:30px;
  font-size:.85rem; font-weight:500; line-height:1;
  cursor:pointer; text-decoration:none;
  transition:background .15s, transform .05s, box-shadow .15s;
  box-shadow:0 2px 8px rgba(74,158,255,.3);
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
.home-btn:hover { background:#2a7ed9; }
.home-btn:active { transform:scale(.96); }

/* ===== 页脚 ===== */
.page-footer {
  text-align:center;
  padding:24px 0 10px;
  font-size:.7rem; color:#8fa3b8; line-height:1.8;
  margin-top:auto;
}

/* ===== 手机适配 ===== */
@media (max-width: 600px) {
  body { padding:14px 8px 6px; }
  .main-card { padding:16px 14px 14px; }
  h1 { font-size:1.15rem; }
  .header-block { padding-top:10px; margin-bottom:12px; }
  .home-btn { height:40px; padding:0 22px; font-size:.8rem; }
  .quick-links { gap:18px; }
  .quick-icon { width:50px; height:50px; }
  .zsm-modal-panel { max-width:300px; }
  .zsm-modal-panel img { max-height:52vh; }
}
</style>
</head>

<body>

      <!-- Telegram 群组（无背景） -->

          <g transform="translate(5,6) scale(1.55)">

<!-- ===== 赞赏码弹层 ===== -->
<div class="zsm-modal" id="zsmModal" aria-hidden="true">
  <div class="zsm-modal-mask" data-close></div>

  <div class="zsm-modal-panel" role="dialog" aria-modal="true" aria-label="微信赞赏码">
    <button class="zsm-modal-close" type="button" data-close aria-label="关闭">×</button>

    <div class="zsm-modal-title">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#07C160"/>
        <path d="M10 26.2 L5.4 32.2 L14.4 29.2 Z" fill="#ffffff"/>
        <ellipse cx="18.5" cy="19" rx="11.2" ry="9.6" fill="#ffffff" stroke="#07C160" stroke-width="1.8"/>
        <path d="M37.4 35.8 L42.4 41 L33.6 38.6 Z" fill="#ffffff"/>
        <ellipse cx="32" cy="30.5" rx="8.8" ry="7.4" fill="#ffffff" stroke="#07C160" stroke-width="1.8"/>
        <circle cx="14.5" cy="18.3" r="1.75" fill="#07C160"/>
        <circle cx="22.5" cy="18.3" r="1.75" fill="#07C160"/>
        <circle cx="28.6" cy="29.9" r="1.45" fill="#07C160"/>
        <circle cx="35.4" cy="29.9" r="1.45" fill="#07C160"/>

    <img src="./vip/zsm.png" alt="微信赞赏码"
         onerror="this.outerHTML='&lt;p class=&quot;zsm-modal-tip&quot;&gt;赞赏码图片未找到，请检查 ./vip/zsm.png 是否存在。&lt;/p&gt;';">

    <p class="zsm-modal-tip">长按图片识别，或保存到相册后扫码</p>
  </div>
</div>

<script>
(function () {
  var btn   = document.getElementById('zsmBtn');
  var modal = document.getElementById('zsmModal');
  var lastFocus = null;

  function openModal() {
    lastFocus = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    var closeBtn = modal.querySelector('.zsm-modal-close');
    if (closeBtn) closeBtn.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  btn.addEventListener('click', openModal);

  // 点击遮罩或关闭按钮
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });

  // ESC 关闭
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.keyCode === 27) && modal.classList.contains('open')) {
      closeModal();
    }
  });
})();
</script>
