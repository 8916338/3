<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button:focus, button:focus-visible, input:focus, input:focus-visible,
.nav-tab:focus, .copy-btn:focus { outline:none !important; }

.container { max-width:820px; margin:0 auto; position:relative; width:100%; overflow-x:hidden; flex:1; display:flex; flex-direction:column; }

.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }
h1 { font-size:1.35rem; font-weight:700; color:#0a1a2b; }
.header-divider { height:1px; background:#e4ebf3; margin:12px 0; }
.subtitle { font-size:.78rem; color:#7a8fa3; line-height:1.6; }
.qq-link { color:#4a9eff; text-decoration:none; font-weight:600; }
.qq-link:hover { text-decoration:underline; }

.main-card { background:#fff; border-radius:8px; padding:20px 22px 18px; border:1px solid #d4dbe5; width:100%; overflow-x:hidden; flex:1; }

.copy-btn {
  flex-shrink:0; background:#4a9eff; color:#fff; border:none; border-radius:30px;
  padding:0 14px; font-size:.7rem; font-weight:500; cursor:pointer; height:26px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, transform .05s; white-space:nowrap; margin-left:auto;
  position:relative; z-index:2; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.copy-btn:active { background:#2a7ed9; transform:scale(.96); }
.copy-btn.copied { background:#3b9b6c; }

.error-msg { text-align:center; color:#dc2626; padding:16px 20px; font-size:.8rem; background:#fef2f2; border:1px solid #fecaca; border-radius:4px; margin:12px 0; word-break:break-all; }

.page-footer { text-align:center; padding:24px 0 10px; font-size:.7rem; color:#8fa3b8; line-height:1.8; margin-top:auto; }

/* ===== 关于页 · 域名分组卡片 ===== */
#about-domains-list { background:transparent !important; padding:0 !important; border:none !important; border-radius:0 !important; margin-top:0 !important; }

#about-domains-list .domain-group-card {
  background:#fff; border:1px solid #e4ebf3; border-radius:12px;
  padding:14px 16px; margin-bottom:12px; min-width:0;
}
#about-domains-list .domain-group-card:last-child { margin-bottom:0; }
#about-domains-list .domain-group-head {
  display:flex; align-items:center; gap:12px; margin-bottom:10px; min-width:0;
}
#about-domains-list .domain-group-info { flex:1; min-width:0; }
#about-domains-list .domain-group-name {
  font-size:.85rem; font-weight:700; color:#0a1a2b;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#about-domains-list .domain-group-desc {
  display:inline-block; margin-top:4px; font-size:.62rem; font-weight:500;
  color:#4a9eff; background:#e8f2ff; padding:2px 10px; border-radius:50px;
  max-width:100%; overflow-wrap:break-word; word-break:break-word;
}
#about-domains-list .domain-line {
  display:flex; align-items:center; gap:8px; padding:6px 14px;
  background:#f4f8fc; border:1px solid #e0e8f0; border-radius:50px;
  margin-top:6px; min-width:0;
}
#about-domains-list .domain-line .url-text {
  font-size:.75rem; color:#2563eb; word-break:break-all;
  overflow-wrap:break-word; line-height:1.4; flex:1; min-width:0;
}
#about-domains-list .domain-empty {
  font-size:.7rem; color:#8fa3b8; padding:4px 2px;
}

/* ===== 状态卡片（保持一致性） ===== */
.status-card {
  background:#fff; border-radius:8px; padding:16px 18px;
  border:1px solid #d4dbe5; margin-bottom:16px; text-align:center;
}
.status-text { font-size:.88rem; color:#2563eb; line-height:1.7; }

@media (max-width: 600px) {
  body { padding: 14px 8px 6px; }
  .main-card { padding:14px 14px 12px; }
  .header-block { padding-top:10px; margin-bottom:12px; }
  h1 { font-size:1.15rem; }
  .copy-btn { font-size:.62rem; padding:0 10px; height:24px; }
  #about-domains-list .domain-group-card { padding:12px 12px; }
  #about-domains-list .domain-group-name { font-size:.8rem; }
  #about-domains-list .domain-line { padding:6px 10px; gap:6px; }
  #about-domains-list .domain-line .url-text { font-size:.7rem; }
}
</style>
</head>

<body>

<div class="container">
  <div class="header-block">
    <h1>海量接口搬运备份</h1>
    <div class="header-divider"></div>
    <p class="subtitle">
      备用数据源，防屏不迷路<br>

        猛戳这里加入QQ群: <span style="color:#00C853;">点击</span>
      </a>
    </p>
  </div>

  <div class="main-card">
    <div style="background:#f8fafc;border-radius:8px;padding:16px 18px;border:1px solid #e4ebf3;margin-bottom:14px">
      <h3 style="font-size:.9rem;margin-bottom:10px;color:#0b1e33">🌐 备份线路域名</h3>
      <p style="margin-bottom:6px;font-size:.76rem;color:#5a6f88">按站长分组，每组域名互为备份，任一个可用：</p>
      <div id="about-domains-list"></div>

  </footer>
</div>

<script>
// ========== 站点分组数据（可自由修改） ==========
const DOMAIN_GROUPS = [
  {
    name: "误道者站点",
    desc: "主站线路",
    domains: [
      "https://0.wudaozhe.net",
      "https://0.12yue.de5.net",
      "https://0.cdz.qzz.io",
      "https://0.wdzb.eu.cc"
    ]
  },
  {
    name: "雪衣玉龙站点",
    desc: "备选线路",
    domains: [
      "https://ym.120733.xyz",
      "https://4.wudaozhe.net"
    ]
  },
  {
    name: "韧忍仁人站点",
    desc: "备选线路",
    domains: [
      "https://liujin86.ccwu.cc",
      "https://8.wudaozhe.net"
    ]
  },
  {
    name: "第五站点",
    desc: "备选线路",
    domains: [
      "https://tvthaox.cc.cd",
      "https://5.wudaozhe.net"
    ]
  },
  {
    name: "祥子站点",
    desc: "备选线路",
    domains: [
      "https://nxz.de5.net",
      "https://6.wudaozhe.net"
    ]
  },
  {
    name: "第七站点",
    desc: "备选线路",
    domains: [
      "https://tvbox-api.luca.dpdns.org"
    ]
  }
];

function getInitials(name) { return name ? name.slice(0,1).toUpperCase() : '?'; }

function renderAboutDomains(groups) {
  const box = document.getElementById('about-domains-list');
  if (!box) return;

  if (!Array.isArray(groups) || !groups.length) {
    box.innerHTML = '<div class="error-msg">暂无域名</div>';
    return;
  }

  box.innerHTML = groups.map(g => {
    const name = g.name || '未命名站点';
    const desc = g.desc || '';
    const list = Array.isArray(g.domains) ? g.domains.filter(Boolean) : [];

    const domainHtml = list.length
      ? list.map(d => `
        <div class="domain-line">
          <span class="url-text">${d}</span>
          <button class="copy-btn" data-url="${d}">复制</button>
        </div>`).join('')
      : '<div class="domain-empty">该站点暂未提供域名</div>';

    return `
      <div class="domain-group-card" data-name="${name.toLowerCase()}">
        <div class="domain-group-head">
          <div class="domain-group-info">
            <div class="domain-group-name" title="${name}">${name}</div>
            ${desc ? `<div class="domain-group-desc">${desc}</div>` : ''}
          </div>
        </div>
        <div>${domainHtml}</div>
      </div>`;
  }).join('');
}

// 复制功能
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('.copy-btn');
  if (!copyBtn) return;
  e.preventDefault(); e.stopPropagation();
  const url = copyBtn.getAttribute('data-url');
  if (!url) return;
  const done = () => {
    const originalText = copyBtn.textContent;
    copyBtn.textContent = '✅ 已复制';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = originalText; copyBtn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fb);
  } else { fb(); }
  function fb() {
    const input = document.createElement('input'); input.value = url;
    input.style.position='fixed'; input.style.opacity='0';
    document.body.appendChild(input); input.focus(); input.select();
    try{document.execCommand('copy');}catch(_){}
    document.body.removeChild(input); done();
  }
});

// 初始化渲染
renderAboutDomains(DOMAIN_GROUPS);
</script>
</body>
</html>
