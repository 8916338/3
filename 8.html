<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>海量接口搬运备份00</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#eef2f7;color:#1a2b3d;padding:20px 14px 10px;min-height:100vh;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;
}
.container{max-width:820px;margin:auto;width:100%;flex:1;display:flex;flex-direction:column}

.header-block{text-align:center;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:700;color:#0a1a2b}
.version-tag{
  display:inline-block;font-size:.66rem;font-weight:600;color:#4a9eff;
  background:#e8f1fb;border:1px solid #c9e0f9;border-radius:20px;
  padding:1px 9px;vertical-align:middle;margin-left:6px;letter-spacing:.3px;
}
.header-divider{height:1px;background:#e4ebf3;margin:12px 0}
.subtitle{font-size:.78rem;color:#7a8fa3;line-height:1.6}
.qq-link{color:#4a9eff;text-decoration:none;font-weight:600}
.qq-link:active{opacity:.7}

.status-card{
  background:#fff;border-radius:8px;padding:16px 18px;
  border:1px solid #d4dbe5;margin-bottom:16px;text-align:center;
}
.status-text{font-size:.88rem;color:#2563eb;line-height:1.7}
.countdown{color:#10b981;font-weight:700;font-size:1.05rem}

.action-buttons{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn-stay,.btn-goto{
  border:none;border-radius:40px;padding:8px 18px;font-size:.8rem;font-weight:500;
  cursor:pointer;transition:background .15s,transform .1s;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;flex:0 1 auto;min-width:100px;
}
.btn-stay{background:#eef2f7;color:#3a5a7a;border:1px solid #cbd5e1}
.btn-stay:active{background:#d9e2ec;transform:scale(.96)}
.btn-goto{background:#4a9eff;color:#fff;box-shadow:0 2px 6px rgba(74,158,255,.3)}
.btn-goto:active{background:#2a7ed9;transform:scale(.96)}

.domains-card{background:#fff;border-radius:8px;padding:18px 18px 14px;border:1px solid #d4dbe5}
.domains-title{font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:6px}
.domains-tip{font-size:.74rem;color:#5a6f88;margin-bottom:10px}

.merged-card{
  background:#fff;border-radius:8px;padding:16px 18px 14px;
  border:1px solid #d4dbe5;margin-bottom:16px;
}

.batch-jump-bar{display:flex;justify-content:center;margin-bottom:14px}
.btn-enter-site{
  height:44px;padding:0 36px;border:none;border-radius:44px;font-size:.92rem;font-weight:600;
  cursor:pointer;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6366f1);
  box-shadow:0 4px 14px rgba(99,102,241,.4);
  transition:background .15s,transform .1s,box-shadow .15s;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-enter-site:active{transform:scale(.96);box-shadow:0 2px 8px rgba(99,102,241,.3)}
.btn-enter-site:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;transform:none}

.btn{
  height:32px;padding:0 16px;border:none;border-radius:6px;font-size:.8rem;font-weight:500;
  cursor:pointer;color:#fff;background:#4a9eff;white-space:nowrap;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:#2563eb}
.btn.success{background:#10b981}
.btn.ghost{background:#fff;color:#5a6f88;border:1px solid #d4dbe5}
.btn:disabled{opacity:.5;cursor:not-allowed}

.ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}

.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:#f7fafd;border:1px solid #e0e8f0;border-radius:8px;
  padding:10px 14px;margin:14px 0;font-size:.82rem;
}
.status-bar .stat{display:flex;gap:14px;flex-wrap:wrap}
.status-bar .stat span{font-size:.78rem;color:#5a6f88}
.status-bar .stat b{font-weight:700}
.b-ok{color:#10b981}.b-fail{color:#ef4444}.b-wait{color:#f59e0b}.b-total{color:#2563eb}

.list-title{font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:6px}
.list-tip{font-size:.74rem;color:#5a6f88;margin-bottom:10px}

.copy-btn{
  flex-shrink:0;background:#4a9eff;color:#fff;border:none;border-radius:30px;padding:0 12px;
  font-size:.68rem;font-weight:500;cursor:pointer;height:26px;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;z-index:1;
}
.copy-btn:active{background:#2a7ed9;transform:scale(.96)}
.copy-btn.copied{background:#3b9b6c}

.url-line{
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f4f8fc;
  border:1px solid #e0e8f0;border-radius:50px;margin-top:8px;min-width:0;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.url-line:hover{background:#e8f1fb;border-color:#4a9eff}
.url-line .dot{
  width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex-shrink:0;transition:background .2s;
}
.url-line.ok .dot{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.url-line.fail .dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.url-line.checking .dot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.url-line .url-text{
  flex:1;font-size:.75rem;color:#2563eb;word-break:break-all;
  overflow-wrap:break-word;line-height:1.4;min-width:0;
}
.url-line .lat{
  flex-shrink:0;font-size:.7rem;color:#7a8fa3;
  font-variant-numeric:tabular-nums;min-width:52px;text-align:right;
}
.url-line.fail .url-text{color:#94a3b8;text-decoration:line-through;text-decoration-color:#cbd5e1}

/* ===== 分组站点样式（复用记住的模式） ===== */
#about-domains-list { margin-top: 0; text-align: left; }
.domain-group-card {
  background: #f8fafc;
  border: 1px solid #e4ebf3;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 12px;
  min-width: 0;
}
.domain-group-card:last-child { margin-bottom: 0; }
.domain-group-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  min-width: 0;
}
.domain-group-info { flex: 1; min-width: 0; }
.domain-group-name {
  font-size: .85rem;
  font-weight: 700;
  color: #0a1a2b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.domain-group-desc {
  display: inline-block;
  margin-top: 4px;
  font-size: .62rem;
  font-weight: 500;
  color: #4a9eff;
  background: #e8f2ff;
  padding: 2px 10px;
  border-radius: 50px;
  max-width: 100%;
  overflow-wrap: break-word;
  word-break: break-word;
}
.domain-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: #fff;
  border: 1px solid #e0e8f0;
  border-radius: 50px;
  margin-top: 6px;
  min-width: 0;
}
.domain-line .url-text {
  font-size: .75rem;
  color: #2563eb;
  word-break: break-all;
  overflow-wrap: break-word;
  line-height: 1.4;
  flex: 1;
  min-width: 0;
}

.contact-section{
  text-align:left;padding:10px 4px 4px;max-width:820px;margin:0 auto;width:100%;
}
.contact-section p{margin-top:8px;font-size:.76rem;color:#5a6f88;line-height:1.6}
.contact-section a{color:#4a9eff;text-decoration:none;font-weight:600;word-break:break-all}
.contact-section a:active{opacity:.7}

.page-footer{
  text-align:left;padding:8px 4px 10px;font-size:.7rem;color:#8fa3b8;line-height:1.8;
  margin-top:auto;max-width:820px;margin-left:auto;margin-right:auto;width:100%;
}
.page-footer p{word-break:break-word;overflow-wrap:break-word}

.mode-jump{display:block}
.mode-batch{display:none}
body.batch-mode .mode-jump{display:none}
body.batch-mode .mode-batch{display:block}

@media (max-width:600px){
  body{padding:14px 10px 6px}
  .merged-card,.status-card,.domains-card{padding:14px 12px 10px}
  .status-bar{flex-direction:column;gap:8px;align-items:flex-start}
  .btn-stay,.btn-goto{padding:7px 14px;font-size:.75rem;min-width:80px}
  .btn-enter-site{height:40px;padding:0 28px;font-size:.86rem}
  .contact-section{padding:8px 4px 2px}
  .page-footer{padding:6px 4px 8px}
  .domain-group-card { padding: 12px 12px; }
  .domain-group-name { font-size: .8rem; }
  .domain-line { padding: 6px 10px; gap: 6px; }
  .domain-line .url-text { font-size: .7rem; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header-block">
    <h1>海量接口搬运备份<span class="version-tag">v1.0.6</span></h1>
    <div class="header-divider"></div>
    <p class="subtitle">
      备用数据源，防屏不迷路<br>
      <a class="qq-link" href="https://qm.qq.com/q/gmRKKPT3x0" target="_blank" rel="noopener noreferrer">猛戳这里加入QQ群: <span style="color:#00C853;">点击</span></a>

    <div class="domains-card">

      </div>

        已切换到批量模式

</div>

<div class="contact-section">
  <p>加入Q群请点击：
    <a id="about-qq" href="https://qm.qq.com/q/gmRKKPT3x0" target="_blank" rel="noopener noreferrer">1067685939</a>

</div>

  </p>

<script>
// ========== 自动检测线路（/into 结尾） ==========
const CONFIG = {
  countdownUrls: [
    "https://0.12yue.de5.net/into",
    "https://0.cdz.qzz.io/into",
    "https://0.wdzb.eu.cc/into",
    "https://0.wudaozhe.net/into"
  ]
};

// ========== 分组站点数据（记住的模式） ==========
const DOMAIN_GROUPS = [
  {
    name: "误道者站点",
    desc: "主站线路",
    domains: [
      "https://0.wudaozhe.net",
      "https://0.12yue.de5.net",
      "https://0.cdz.qzz.io",
      "https://0.wdzb.eu.cc"
    ]
  },
  {
    name: "雪衣玉龙站点",
    desc: "备选线路",
    domains: [
      "https://ym.120733.xyz",
      "https://4.wudaozhe.net"
    ]
  },
  {
    name: "韧忍仁人站点",
    desc: "备选线路",
    domains: [
      "https://liujin86.ccwu.cc",
      "https://8.wudaozhe.net"
    ]
  },
  {
    name: "第五站点",
    desc: "备选线路",
    domains: [
      "https://tvthaox.cc.cd",
      "https://5.wudaozhe.net"
    ]
  },
  {
    name: "祥子站点",
    desc: "备选线路",
    domains: [
      "https://nxz.de5.net",
      "https://6.wudaozhe.net"
    ]
  },
  {
    name: "第七站点",
    desc: "备选线路",
    domains: [
      "https://tvbox-api.luca.dpdns.org"
    ]
  }
];

const TIMEOUT_SEC = 12;

function noCacheUrl(url) {
  const sep = url.includes("?") ? "&" : "?";
  return url + sep + "_t=" + Date.now();
}

(function clearAllCaches() {
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) { caches.delete(k); });
    }).catch(function(){});
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    }).catch(function(){});
  }
})();

let mode = 'jump';
let jumpTargetUrl = null;

const bodyEl = document.body;
const statusEl = document.getElementById('status');
const actionButtons = document.getElementById('actionButtons');
const stayBtn = document.getElementById('stayBtn');
const gotoBtn = document.getElementById('gotoBtn');
const aboutDomainsListEl = document.getElementById('about-domains-list');
const btnEnterSite = document.getElementById('btnEnterSite');

// ========== 渲染分组站点 ==========
function renderAboutDomains() {
  aboutDomainsListEl.innerHTML = '';
  DOMAIN_GROUPS.forEach(function(group) {
    const card = document.createElement('div');
    card.className = 'domain-group-card';
    card.dataset.name = group.name;

    const head = document.createElement('div');
    head.className = 'domain-group-head';
    head.innerHTML =
      '<div class="domain-group-info">' +
        '<div class="domain-group-name" title="' + group.name + '">' + group.name + '</div>' +
        (group.desc ? '<div class="domain-group-desc">' + group.desc + '</div>' : '') +
      '</div>';
    card.appendChild(head);

    const bodyDiv = document.createElement('div');
    group.domains.forEach(function(domain) {
      const line = document.createElement('div');
      line.className = 'domain-line';
      line.innerHTML =
        '<span class="url-text">' + domain + '</span>' +
        '<button class="copy-btn" data-url="' + domain + '">复制</button>';
      bodyDiv.appendChild(line);
    });
    card.appendChild(bodyDiv);

    aboutDomainsListEl.appendChild(card);
  });
}

// ========== 切换模式 ==========
function switchToBatchMode() {
  mode = 'batch';
  bodyEl.classList.add('batch-mode');
  if (jumpTimer) { clearInterval(jumpTimer); jumpTimer = null; }
}

function switchToJumpMode() {
  mode = 'jump';
  bodyEl.classList.remove('batch-mode');
  jumpTargetUrl = null;
  actionButtons.style.display = 'none';
  statusEl.textContent = '⏳ 正在检测可用线路...';
  checkFirstAvailable();
}

// ========== 检测逻辑 ==========
async function checkFirstAvailable() {
  const urls = CONFIG.countdownUrls;
  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    statusEl.textContent = '⏳ 正在检测第 ' + (i + 1) + ' 个线路：' + url;
    const ok = await probeUrl(url, TIMEOUT_SEC);
    if (ok) {
      jumpTargetUrl = url;
      startJumpCountdown(url, 5);
      return;
    }
  }
  statusEl.innerHTML = '❌ 所有线路均不可用，请稍后再试';
  actionButtons.style.display = 'none';
}

function probeUrl(url, timeoutSec) {
  return new Promise(function(resolve) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, timeoutSec * 1000);
    fetch(noCacheUrl(url), {
      method: 'GET',
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller.signal,
      headers: {
        'Cache-Control': 'no-cache, no-store, must-revalidate',
        'Pragma': 'no-cache'
      }
    })
      .then(function() { clearTimeout(timer); resolve(true); })
      .catch(function() { clearTimeout(timer); resolve(false); });
  });
}

// ========== 倒计时跳转 ==========
let jumpTimer = null;
function startJumpCountdown(url, seconds) {
  if (jumpTimer) clearInterval(jumpTimer);
  let remain = seconds;
  actionButtons.style.display = 'flex';
  stayBtn.style.display = 'inline-flex';
  gotoBtn.style.display = 'inline-flex';

  function update() {
    statusEl.innerHTML = '✅ 线路可用，<span class="countdown">' + remain + '</span> 秒后跳转<br>' +
      '<span style="font-size:.75rem;color:#5a6f88">' + url + '</span>';
  }
  update();

  jumpTimer = setInterval(function() {
    remain--;
    if (remain > 0) {
      update();
    } else {
      clearInterval(jumpTimer);
      jumpTimer = null;
      window.location.href = url;
    }
  }, 1000);

  stayBtn.onclick = function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (jumpTimer) { clearInterval(jumpTimer); jumpTimer = null; }
    switchToBatchMode();
  };

  gotoBtn.onclick = function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (jumpTimer) { clearInterval(jumpTimer); jumpTimer = null; }
    window.location.href = url;
  };
}

// ========== 按钮事件 ==========
btnEnterSite.addEventListener("click", function() {
  switchToJumpMode();
});

// ========== 复制功能 ==========
document.addEventListener("click", function(e) {
  const copy = e.target.closest(".copy-btn");
  if (copy) {
    e.preventDefault();
    e.stopPropagation();
    const url = copy.dataset.url;
    copyText(url, function() {
      const o = copy.textContent;
      copy.textContent = "✅ 已复制";
      copy.classList.add("copied");
      setTimeout(function() {
        copy.textContent = o;
        copy.classList.remove("copied");
      }, 1500);
    });
  }
});

function copyText(text, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function() { fallback(); });
  } else {
    fallback();
  }
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    done();
  }
}

// ========== 初始化 ==========
renderAboutDomains();
checkFirstAvailable();
</script>
</body>
