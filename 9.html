<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金色法轮网标展示</title>
  <style>
    /* 页面基础样式 */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 展示卡片容器 */
    .logo-container {
      background: #242424;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #333;
    }

    /* 鼠标悬停卡片浮起效果 */
    .logo-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* 网标 SVG 样式 */
    .logo-svg {
      width: 180px;
      height: 180px;
      /* 给 SVG 加一层淡淡的发光效果 */
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
    }

    /* 标题文字 */
    .logo-title {
      color: #D4AF37;
      font-size: 1.4rem;
      letter-spacing: 4px;
      margin: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* 副标题文字 */
    .logo-subtitle {
      color: #777;
      font-size: 0.85rem;
      margin: 0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- SVG 网标 -->
    <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <!-- 金色渐变 -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F9D423" />
          <stop offset="50%" stop-color="#E5B80B" />
          <stop offset="100%" stop-color="#D4AF37" />
        </linearGradient>
        
        <!-- 淡淡的投影，增加质感 -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
        </filter>
      </defs>

      <g filter="url(#shadow)">
        <!-- 1. 外圈边缘 -->
        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
        <circle cx="60" cy="60" r="48" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="0 6.28" stroke-linecap="round" />
        <circle cx="60" cy="60" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" />

        <!-- 2. 外侧的 8 个尖角 -->
        <g fill="url(#goldGradient)">
          <polygon points="60,0 65,6 60,12 55,6" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(45 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(90 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(135 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(180 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(225 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(270 60 60)" />
          <polygon points="60,0 65,6 60,12 55,6" transform="rotate(315 60 60)" />
        </g>

        <!-- 3. 八根辐条 -->
        <g fill="url(#goldGradient)">
          <path d="M 55 44 L 60 12 L 65 44 Z" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(45 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(45 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(90 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(90 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(135 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(135 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(180 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(180 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(225 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(225 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(270 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(270 60 60)" />
          
          <path d="M 55 44 L 60 12 L 65 44 Z" transform="rotate(315 60 60)" />
          <path d="M 52 14 L 60 8 L 68 14 L 60 18 Z" transform="rotate(315 60 60)" />
        </g>

        <!-- 4. 中心花鼓 -->
        <circle cx="60" cy="60" r="18" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
        
        <g fill="url(#goldGradient)">
          <circle cx="60" cy="46" r="4" />
          <circle cx="60" cy="46" r="4" transform="rotate(45 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(90 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(135 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(180 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(225 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(270 60 60)" />
          <circle cx="60" cy="46" r="4" transform="rotate(315 60 60)" />
        </g>

        <circle cx="60" cy="60" r="10" fill="url(#goldGradient)" />
        
        <g fill="#FFFFFF">
          <circle cx="60" cy="60" r="2.5" />
          <circle cx="60" cy="53" r="1.5" />
          <circle cx="60" cy="67" r="1.5" />
          <circle cx="53" cy="60" r="1.5" />
          <circle cx="67" cy="60" r="1.5" />
        </g>
      </g>
    </svg>

    <h1 class="logo-title">法 轮 金 标</h1>
    <p class="logo-subtitle">Dharmachakra Logo</p>
  </div>

</body>
</html>
