<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>海量接口搬运备份</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#eef2f7;color:#1a2b3d;padding:20px 14px 10px;min-height:100vh;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;
}
.container{max-width:820px;margin:auto;width:100%;flex:1;display:flex;flex-direction:column}

.header-block{text-align:center;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:700;color:#0a1a2b}
.version-tag{
  display:inline-block;font-size:.66rem;font-weight:600;color:#4a9eff;
  background:#e8f1fb;border:1px solid #c9e0f9;border-radius:20px;
  padding:1px 9px;vertical-align:middle;margin-left:6px;letter-spacing:.3px;
}
.header-divider{height:1px;background:#e4ebf3;margin:12px 0}
.subtitle{font-size:.78rem;color:#7a8fa3;line-height:1.6}
.qq-link{color:#4a9eff;text-decoration:none;font-weight:600}
.qq-link:active{opacity:.7}

.status-card{
  background:#fff;border-radius:8px;padding:16px 18px;
  border:1px solid #d4dbe5;margin-bottom:16px;text-align:center;
}
.status-text{font-size:.88rem;color:#2563eb;line-height:1.7}
.countdown{color:#10b981;font-weight:700;font-size:1.05rem}

.action-buttons{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn-stay,.btn-goto{
  border:none;border-radius:40px;padding:8px 18px;font-size:.8rem;font-weight:500;
  cursor:pointer;transition:background .15s,transform .1s;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;flex:0 1 auto;min-width:100px;
}
.btn-stay{background:#eef2f7;color:#3a5a7a;border:1px solid #cbd5e1}
.btn-stay:active{background:#d9e2ec;transform:scale(.96)}
.btn-goto{background:#4a9eff;color:#fff;box-shadow:0 2px 6px rgba(74,158,255,.3)}
.btn-goto:active{background:#2a7ed9;transform:scale(.96)}

.domains-card{background:#fff;border-radius:8px;padding:18px 18px 14px;border:1px solid #d4dbe5}
.domains-title{font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:6px}
.domains-tip{font-size:.74rem;color:#5a6f88;margin-bottom:10px}

.copy-btn{
  flex-shrink:0;background:#4a9eff;color:#fff;border:none;border-radius:30px;padding:0 12px;
  font-size:.68rem;font-weight:500;cursor:pointer;height:26px;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;z-index:1;
}
.copy-btn:active{background:#2a7ed9;transform:scale(.96)}
.copy-btn.copied{background:#3b9b6c}

/* ====== 备份域名分组样式 ====== */
#about-domains-list {
  margin-top: 16px;
  text-align: left;
}
.domain-group-card {
  background: #fff;
  border: 1px solid #d4dbe5;
  border-radius: 8px;
  margin-bottom: 12px;
  overflow: hidden;
}
.domain-group-head {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  background: #f7fafd;
  border-bottom: 1px solid #e0e8f0;
}
.domain-group-info {
  flex: 1;
}
.domain-group-name {
  font-size: .88rem;
  font-weight: 600;
  color: #0b1e33;
}
.domain-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px 8px 14px;
  border-bottom: 1px solid #f0f4f9;
}
.domain-line:last-child {
  border-bottom: none;
}
.domain-line .url-text {
  font-size: .75rem;
  color: #2563eb;
  word-break: break-all;
  flex: 1;
  margin-right: 8px;
}
.domain-line .copy-btn {
  flex-shrink: 0;
}

/* 顶部简易线路列表 */
.url-line-simple{
  display:flex;align-items:center;gap:8px;padding:6px 14px;background:#f4f8fc;
  border:1px solid #e0e8f0;border-radius:50px;margin-top:8px;min-width:0;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.url-line-simple:hover{background:#e8f1fb;border-color:#4a9eff}
.url-line-simple:active{background:#dce9f8}
.url-line-simple .url-text{
  flex:1;font-size:.75rem;color:#2563eb;word-break:break-all;
  overflow-wrap:break-word;line-height:1.4;min-width:0;
}

/* ====== 过渡页（伪装成页面） ====== */
.splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #eef2f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: opacity .5s ease;
}
.splash-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.splash-logo {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg,#4a9eff,#2563eb);
  color: #fff;
  font-size: 2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(74,158,255,.35);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100%{ transform: scale(1); box-shadow: 0 8px 24px rgba(74,158,255,.35); }
  50%{ transform: scale(1.06); box-shadow: 0 10px 30px rgba(74,158,255,.5); }
}
.splash-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #0a1a2b;
  margin-bottom: 8px;
  text-align: center;
}
.splash-sub {
  font-size: .8rem;
  color: #5a6f88;
  margin-bottom: 22px;
  text-align: center;
}
.splash-count {
  font-size: 3rem;
  font-weight: 800;
  color: #4a9eff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin-bottom: 10px;
}
.splash-target {
  font-size: .72rem;
  color: #7a8fa3;
  word-break: break-all;
  text-align: center;
  max-width: 320px;
  margin-bottom: 28px;
}
.splash-bar {
  width: 200px;
  height: 4px;
  background: #dbe5f0;
  border-radius: 4px;
  overflow: hidden;
}
.splash-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#4a9eff,#10b981);
  border-radius: 4px;
  transition: width 1s linear;
}
.splash-skip {
  margin-top: 26px;
  border: 1px solid #cbd5e1;
  background: #fff;
  color: #3a5a7a;
  border-radius: 40px;
  padding: 8px 22px;
  font-size: .78rem;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.splash-skip:active{ background:#eef2f7; transform: scale(.96); }

.contact-section{
  text-align:left;padding:10px 4px 4px;max-width:820px;margin:0 auto;width:100%;
}
.contact-section p{margin-top:8px;font-size:.76rem;color:#5a6f88;line-height:1.6}
.contact-section a{color:#4a9eff;text-decoration:none;font-weight:600;word-break:break-all}
.contact-section a:active{opacity:.7}

.page-footer{
  text-align:left;padding:8px 4px 10px;font-size:.7rem;color:#8fa3b8;line-height:1.8;
  margin-top:auto;max-width:820px;margin-left:auto;margin-right:auto;width:100%;
}
.page-footer p{word-break:break-word;overflow-wrap:break-word}

@media (max-width:600px){
  body{padding:14px 10px 6px}
  .status-card,.domains-card{padding:14px 12px 10px}
  .btn-stay,.btn-goto{padding:7px 14px;font-size:.75rem;min-width:80px}
  .contact-section{padding:8px 4px 2px}
  .page-footer{padding:6px 4px 8px}
}
</style>
</head>
<body>
<div class="container">

  <div class="header-block">
    <h1>海量接口搬运备份<span class="version-tag">v1.0.6</span></h1>
    <div class="header-divider"></div>
    <p class="subtitle">
      备用数据源，防屏不迷路<br>
      <a class="qq-link" href="https://0.wudaozhe.net/qq群" target="_blank" rel="noopener noreferrer">猛戳这里加入QQ群: <span style="color:#00C853;">点击</span></a>
    </p>
  </div>

  <div class="status-card" id="jumpStatusCard">
    <div class="status-text" id="status">⏳ 正在检测可用线路...</div>
    <!-- 检测时直接显示的分组站点列表 -->
    <div id="about-domains-list"></div>
  </div>

  <div class="domains-card">
    <div class="domains-title">🌐 备份线路域名</div>
    <div class="domains-tip">以下域名互为备份，任一个可用（点击整行跳转）：</div>
    <div id="simpleList"></div>
  </div>

</div>

<div class="contact-section">
  <p>加入Q群请点击：
    <a id="about-qq" href="https://qm.qq.com/q/gmRKKPT3x0" target="_blank" rel="noopener noreferrer">1067685939</a>
  </p>
  <p>加入tg群组请点击：
    <a id="about-tg" href="https://t.me/tg6603" target="_blank" rel="noopener noreferrer">https://t.me/tg6603</a>
  </p>
  <p>项目地址：
    <a href="https://github.com/lubin776/tvbox-api-backup" target="_blank" rel="noopener noreferrer">https://github.com/lubin776/tvbox-api-backup</a>
  </p>
</div>

<footer class="page-footer">
  <p>
    本站接口资源由【误道者】整理。所有资源均来自互联网，版权归原作者所有。
    仅供测试学习使用，请勿用于违法及商业用途，请勿付费购买。
    如涉及侵权，请联系删除。
  </p>
</footer>

<script>
// ========== JSON 配置区 ==========
// 自主检测线路 (用于自动跳转 /into)
const CONFIG = {
  countdownUrls: [
    "https://0.12yue.de5.net/into",
    "https://0.cdz.qzz.io/into",
    "https://0.wdzb.eu.cc/into",
    "https://0.wudaozhe.net/into"
  ]
};

// 站点分组数据 (无logo，仅名称与域名，方便修改)
const DOMAIN_GROUPS = [
  {
    name: "误道者站点",
    domains: [
      "https://0.wudaozhe.net",
      "https://0.12yue.de5.net",
      "https://0.cdz.qzz.io",
      "https://0.wdzb.eu.cc"
    ]
  },
  {
    name: "雪衣玉龙站点",
    domains: [
      "https://ym.120733.xyz",
      "https://4.wudaozhe.net"
    ]
  },
  {
    name: "韧忍仁人站点",
    domains: [
      "https://liujin86.ccwu.cc",
      "https://8.wudaozhe.net"
    ]
  },
  {
    name: "第五站点",
    domains: [
      "https://tvthaox.cc.cd",
      "https://5.wudaozhe.net"
    ]
  },
  {
    name: "祥子站点",
    domains: [
      "https://nxz.de5.net",
      "https://6.wudaozhe.net"
    ]
  },
  {
    name: "第七站点",
    domains: [
      "https://tvbox-api.luca.dpdns.org"
    ]
  }
];

const TIMEOUT_SEC = 12;

function noCacheUrl(url) {
  const sep = url.includes("?") ? "&" : "?";
  return url + sep + "_t=" + Date.now();
}

(function clearAllCaches() {
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) { caches.delete(k); });
    }).catch(function(){});
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    }).catch(function(){});
  }
})();

const statusEl = document.getElementById('status');
const simpleListEl = document.getElementById('simpleList');
const aboutDomainsListEl = document.getElementById('about-domains-list');

function displayUrl(u) { return u.replace(/\/$/, "").replace(/\/app$/, "") || u; }

// 渲染顶部简易线路列表 (从分组数据提取)
function renderSimpleList() {
  simpleListEl.innerHTML = '';
  const seen = new Set();
  DOMAIN_GROUPS.forEach(function(g) {
    g.domains.forEach(function(u) {
      const d = displayUrl(u);
      if (!seen.has(d)) {
        seen.add(d);
        const line = document.createElement('div');
        line.className = 'url-line-simple';
        line.dataset.url = d;
        line.innerHTML =
          '<span class="url-text">' + d + '</span>' +
          '<button class="copy-btn" data-url="' + d + '">复制</button>';
        simpleListEl.appendChild(line);
      }
    });
  });
}

// 生成备份站点分组 HTML (无logo，只显示站点名称)
function renderAboutDomainsList() {
  aboutDomainsListEl.innerHTML = '';
  DOMAIN_GROUPS.forEach(function(group) {
    const card = document.createElement('div');
    card.className = 'domain-group-card';
    card.dataset.name = group.name;

    const head = document.createElement('div');
    head.className = 'domain-group-head';
    head.innerHTML =
      '<div class="domain-group-info">' +
        '<div class="domain-group-name" title="' + group.name + '">' + group.name + '</div>' +
      '</div>';
    card.appendChild(head);

    const bodyDiv = document.createElement('div');
    group.domains.forEach(function(domain) {
      const line = document.createElement('div');
      line.className = 'domain-line';
      line.innerHTML =
        '<span class="url-text">' + domain + '</span>' +
        '<button class="copy-btn" data-url="' + domain + '">复制</button>';
      bodyDiv.appendChild(line);
    });
    card.appendChild(bodyDiv);

    aboutDomainsListEl.appendChild(card);
  });
}

// ========== 伪装过渡页 ==========
let splashTimer = null;

function showSplashAndJump(targetUrl) {
  // 创建过渡层
  const overlay = document.createElement('div');
  overlay.className = 'splash-overlay';
  overlay.innerHTML =
    '<div class="splash-logo">TV</div>' +
    '<div class="splash-title">正在进入网站</div>' +
    '<div class="splash-sub">请稍候，正在为你加载最优线路…</div>' +
    '<div class="splash-count" id="splashCount">5</div>' +
    '<div class="splash-target" id="splashTarget">' + targetUrl + '</div>' +
    '<div class="splash-bar"><div class="splash-bar-inner" id="splashBar"></div></div>' +
    '<button class="splash-skip" id="splashSkip">跳过等待</button>';
  document.body.appendChild(overlay);

  const countEl = overlay.querySelector('#splashCount');
  const barEl = overlay.querySelector('#splashBar');
  const skipBtn = overlay.querySelector('#splashSkip');

  let remain = 5;
  countEl.textContent = remain;
  // 进度条动画
  setTimeout(function(){ barEl.style.width = '100%'; }, 50);

  function doJump() {
    if (splashTimer) { clearInterval(splashTimer); splashTimer = null; }
    window.location.href = targetUrl;
  }

  skipBtn.addEventListener('click', doJump);

  splashTimer = setInterval(function() {
    remain--;
    countEl.textContent = remain;
    if (remain <= 0) {
      clearInterval(splashTimer);
      splashTimer = null;
      doJump();
    }
  }, 1000);
}

// 检测线路
async function checkFirstAvailable() {
  // 先渲染分组，检测过程中直接显示
  renderAboutDomainsList();

  const urls = CONFIG.countdownUrls;
  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    statusEl.textContent = '⏳ 正在检测第 ' + (i + 1) + ' 个线路：' + url;
    const ok = await probeUrl(url, TIMEOUT_SEC);
    if (ok) {
      statusEl.innerHTML = '✅ 线路可用，正在进入…<br><span style="font-size:.75rem;color:#5a6f88">' + url + '</span>';
      // 显示伪装过渡页并倒计时5秒后跳转
      showSplashAndJump(url);
      return;
    }
  }

  // 全部失败
  statusEl.innerHTML = '❌ 所有线路均不可用，请手动选择以下备份线路：';
}

function probeUrl(url, timeoutSec) {
  return new Promise(function(resolve) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, timeoutSec * 1000);
    fetch(noCacheUrl(url), {
      method: 'GET',
      mode: 'no-cors',
      cache: 'no-store',
      signal: controller.signal,
      headers: {
        'Cache-Control': 'no-cache, no-store, must-revalidate',
        'Pragma': 'no-cache'
      }
    })
      .then(function() { clearTimeout(timer); resolve(true); })
      .catch(function() { clearTimeout(timer); resolve(false); });
  });
}

document.addEventListener("click", function(e) {
  const copy = e.target.closest(".copy-btn");
  if (copy) {
    e.preventDefault();
    e.stopPropagation();
    const url = copy.dataset.url;
    copyText(url, function() {
      const o = copy.textContent;
      copy.textContent = "✅ 已复制";
      copy.classList.add("copied");
      setTimeout(function() {
        copy.textContent = o;
        copy.classList.remove("copied");
      }, 1500);
    });
    return;
  }
  const simpleLine = e.target.closest(".url-line-simple");
  if (simpleLine && simpleLine.dataset.url) {
    window.open(simpleLine.dataset.url, "_blank");
  }
});

function copyText(text, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function() { fallback(); });
  } else {
    fallback();
  }
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    done();
  }
}

// 初始化
renderSimpleList();
checkFirstAvailable();
</script>
</body>
</html>
