<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份 · 随心支持</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.container {
  max-width:820px; margin:0 auto; position:relative;
  width:100%; overflow-x:hidden;
  flex:1; display:flex; flex-direction:column;
}

/* ===== 顶部标题区 ===== */
.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }

h1 {
  font-size:1.35rem; font-weight:700; color:#0a1a2b;
  line-height:1.4;
}

.header-divider {
  height:1px; background:#e4ebf3;
  margin:12px 0;
}

.subtitle {
  font-size:.78rem; color:#7a8fa3; line-height:1.8;
}

/* ===== 卡片主体 ===== */
.main-card {
  background:#fff; border-radius:8px;
  padding:20px 22px 18px;
  border:1px solid #d4dbe5;
  width:100%; overflow-x:hidden; flex:1;
  display:flex; flex-direction:column;
}

/* ===== QQ 群 ===== */
.qq-block {
  font-size:.76rem; color:#5a6f88; line-height:2;
  margin-top:6px;
}

.qq-block .qq-row {
  margin-top:8px;
}

.qq-block a {
  color:#4a9eff; text-decoration:none; font-weight:600;
}
.qq-block a:hover { text-decoration:underline; }

.section-title {
  font-size:.85rem; font-weight:700; color:#0a1a2b;
  margin:22px 0 4px;
}

/* ===== 赞赏码 ===== */
.reward-block {
  text-align:center;
  margin-top:6px;
}

.reward-block img {
  width: 100%;              /* ✅ 和文字一样宽 */
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  border: 1px solid #d4dbe5;
  background:#fff;
  padding: 8px;
  display: block;
}

.reward-tip {
  font-size:.74rem; color:#7a8fa3; line-height:1.8;
  margin-top:10px;
}

.reward-soft {
  font-size:.72rem; color:#9aa8b8; line-height:1.8;
  margin-top:8px;
  padding:8px 12px;
  background:#f5f8fc;
  border-radius:6px;
}

/* ===== 返回首页按钮 ===== */
.home-btn-wrap {
  text-align:center; margin-top:28px;
}

.home-btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px;
  height:42px; padding:0 28px;
  background:#4a9eff; color:#fff;
  border:none; border-radius:30px;
  font-size:.85rem; font-weight:500; line-height:1;
  cursor:pointer; text-decoration:none;
  transition:background .15s, transform .05s, box-shadow .15s;
  box-shadow:0 2px 8px rgba(74,158,255,.3);
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
.home-btn:hover { background:#2a7ed9; }
.home-btn:active { transform:scale(.96); }

/* ===== 页脚 ===== */
.page-footer {
  text-align:center;
  padding:24px 0 10px;
  font-size:.7rem; color:#8fa3b8; line-height:1.8;
  margin-top:auto;
}

/* ===== 手机适配 ===== */
@media (max-width: 600px) {
  body { padding:14px 8px 6px; }
  .main-card { padding:16px 14px 14px; }
  h1 { font-size:1.15rem; }
  .header-block { padding-top:10px; margin-bottom:12px; }
  .home-btn { height:40px; padding:0 22px; font-size:.8rem; }
}
</style>
</head>

<body>

<div class="container">

  <!-- 顶部标题 -->
  <div class="header-block">
    <h1>海量接口搬运备份</h1>
    <div class="header-divider"></div>
    <p class="subtitle">
      备用数据源，防屏不迷路<br>
      资源长期免费分享，能跑多久看上游，不保证永久可用
    </p>
  </div>

  <!-- 主卡片 -->
  <div class="main-card">

    <div class="qq-block">
      QQ 交流群：
      <div class="qq-row"><a href="https://qm.qq.com/q/ApgHrgV7Y4" target="_blank" rel="noopener noreferrer">一群 1067685939</a></div>
      <div class="qq-row"><a href="https://qm.qq.com/q/LCBc86ZE4K" target="_blank" rel="noopener noreferrer">二群 963502550</a></div>
      <div class="qq-row"><a href="https://qm.qq.com/q/syZRStM2ha" target="_blank" rel="noopener noreferrer">三群 931343329</a></div>
      <div class="qq-row"><a href="https://qm.qq.com/q/KKVaXiuiOe" target="_blank" rel="noopener noreferrer">四群 616843624</a></div>
      <div class="qq-row"><a href="https://qm.qq.com/q/Bq1QqyQDK0" target="_blank" rel="noopener noreferrer">五群 594253529</a></div>
    </div>

    <!-- 随心支持 -->
    <div class="section-title">☕ 随心支持一下</div>
    <div class="reward-block">
      <!-- 把 src 换成你的微信赞赏码图片 -->
      <img src="./vip/zsm.png" alt="微信赞赏码">

      <p class="reward-tip">
        备份、同步、更新都挺费电。<br>
        若这个站帮过你一次，欢迎请我喝杯咖啡，金额随你。
      </p>

      <p class="reward-soft">
        纯自愿，不打赏也完全不影响使用。<br>
        赞赏不等于售后绑定，也不承诺接口永久可用。
      </p>
    </div>

    <!-- 返回首页 -->
    <div class="home-btn-wrap">
      <a class="home-btn" href="index.html">返回首页</a>
    </div>

  </div>

  <!-- 页脚 -->
  <footer class="page-footer">
    <p>本站接口资源由【误道者】整理，仅供学习交流，所有资源均来自互联网，版权归原作者所有。</p>
    <p>支持仅代表个人自愿打赏，与接口可用性、特定资源可播性无关。</p>
  </footer>

</div>

</body>
</html>
